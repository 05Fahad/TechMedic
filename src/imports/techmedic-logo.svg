<svg viewBox="0 0 120 162" fill="none" xmlns="http://www.w3.org/2000/svg" width="400" height="540">
  <defs>
    <radialGradient id="screenGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2a4a" />
      <stop offset="100%" stop-color="#041525" />
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a6aad" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0d3a6e" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <rect x="4" y="4" width="112" height="76" rx="10" fill="none" stroke="#1a6aad" stroke-width="1" opacity="0.4" />

  <!-- Monitor body -->
  <rect x="8" y="8" width="104" height="70" rx="8" fill="#071e36" stroke="#1e5fa0" stroke-width="2" />

  <!-- Screen -->
  <rect x="13" y="13" width="94" height="60" rx="5" fill="url(#screenGrad)" />
  <rect x="13" y="13" width="94" height="60" rx="5" fill="url(#glowGrad)" />

  <!-- Circuit lines horizontal -->
  <line x1="13" y1="30" x2="44" y2="30" stroke="#1e6aad" stroke-width="0.8" opacity="0.6" />
  <line x1="76" y1="30" x2="107" y2="30" stroke="#1e6aad" stroke-width="0.8" opacity="0.6" />
  <line x1="13" y1="55" x2="44" y2="55" stroke="#1e6aad" stroke-width="0.8" opacity="0.6" />
  <line x1="76" y1="55" x2="107" y2="55" stroke="#1e6aad" stroke-width="0.8" opacity="0.6" />

  <!-- Circuit lines vertical -->
  <line x1="30" y1="13" x2="30" y2="36" stroke="#1e6aad" stroke-width="0.8" opacity="0.6" />
  <line x1="90" y1="13" x2="90" y2="36" stroke="#1e6aad" stroke-width="0.8" opacity="0.6" />
  <line x1="30" y1="73" x2="30" y2="49" stroke="#1e6aad" stroke-width="0.8" opacity="0.6" />
  <line x1="90" y1="73" x2="90" y2="49" stroke="#1e6aad" stroke-width="0.8" opacity="0.6" />

  <!-- Circuit dots -->
  <circle cx="30" cy="36" r="2" fill="#1e6aad" opacity="0.7" />
  <circle cx="90" cy="36" r="2" fill="#1e6aad" opacity="0.7" />
  <circle cx="30" cy="49" r="2" fill="#1e6aad" opacity="0.7" />
  <circle cx="90" cy="49" r="2" fill="#1e6aad" opacity="0.7" />

  <!-- Medical cross skinny -->
  <rect x="55" y="22" width="10" height="41" rx="3" fill="#00e5cc" filter="url(#glow)" />
  <rect x="39" y="36" width="42" height="11" rx="3" fill="#00e5cc" filter="url(#glow)" />

  <!-- Monitor bottom -->
  <rect x="8" y="72" width="104" height="6" rx="0" fill="#0d3d6e" opacity="0.8" />

  <!-- Stand -->
  <path d="M52 78 L48 100 L72 100 L68 78 Z" fill="#071e36" stroke="#1e5fa0" stroke-width="1.5" />

  <!-- Base -->
  <rect x="34" y="100" width="52" height="10" rx="5" fill="#071e36" stroke="#1e5fa0" stroke-width="1.5" />
  <rect x="36" y="105" width="48" height="2" rx="1" fill="#1e6aad" opacity="0.5" />

  <!-- TechMedic text -->
  <text x="60" y="138" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" letter-spacing="2">
    <tspan fill="#EEF0F5">Tech</tspan><tspan fill="#2563EB">Medic</tspan>
  </text>
</svg>
